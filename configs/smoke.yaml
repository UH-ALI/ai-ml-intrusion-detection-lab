# End-to-end check on small synthetic data. Runs anywhere in about a minute:
#   python scripts/run_experiment.py configs/smoke.yaml
name: smoke
output_dir: results/smoke
seeds: [0, 1]
data:
  train: {source: synthetic, n_rows: 4000, domain: source, seed: 0}
  test: {source: synthetic, n_rows: 4000, domain: target, seed: 1}
prepare:
  train: {balance: true}
  test: {balance: true}
in_domain_test_size: 0.3
features: baseline_cic
scaler: standard
models: [dummy, dt_baseline, rf_baseline, svm_baseline, nb_baseline, ann_baseline,
         dnn_baseline, logreg, lightgbm]
model_params:
  rf_baseline: {n_estimators: 50}
